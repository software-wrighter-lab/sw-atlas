[workspace]
members = ["crates/atlas-core", "crates/atlas-corpus", "crates/atlas-decide"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Michael A Wright"]
license = "MIT"
repository = "https://github.com/software-wrighter-lab/sw-atlas"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }
atlas-decide = { path = "crates/atlas-decide" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
