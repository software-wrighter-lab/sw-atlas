[workspace]
members = [
    "crates/atlas-blog",
    "crates/atlas-campus",
    "crates/atlas-core",
    "crates/atlas-corpus",
    "crates/atlas-decide",
    "crates/atlas-graph",
    "crates/atlas-ingest",
    "crates/atlas-repos",
    "crates/atlas-video",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Michael A Wright"]
license = "MIT"
repository = "https://github.com/software-wrighter-lab/sw-atlas"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.dependencies]
atlas-blog = { path = "crates/atlas-blog" }
atlas-campus = { path = "crates/atlas-campus" }
atlas-core = { path = "crates/atlas-core" }
atlas-corpus = { path = "crates/atlas-corpus" }
atlas-decide = { path = "crates/atlas-decide" }
atlas-graph = { path = "crates/atlas-graph" }
atlas-repos = { path = "crates/atlas-repos" }
atlas-video = { path = "crates/atlas-video" }
clap = { version = "4", features = ["derive"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
